<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduVision AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="floating-icons" aria-hidden="true">
        <span style="--x: 8%; --y: 18%; --d: 0s;">AI</span>
        <span style="--x: 86%; --y: 16%; --d: 1.4s;">%</span>
        <span style="--x: 76%; --y: 48%; --d: 2.8s;">ML</span>
        <span style="--x: 12%; --y: 64%; --d: 4.1s;">PDF</span>
        <span style="--x: 90%; --y: 76%; --d: 5.3s;">TOP</span>
        <span style="--x: 22%; --y: 86%; --d: 6.2s;">CSV</span>
    </div>
    {% block body %}{% endblock %}
    <div id="toastStack" class="toast-stack" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
